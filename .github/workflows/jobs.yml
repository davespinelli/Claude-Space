name: freelance-job-scan
on:
  # Schedule removed 2026-09-23: David dropped the Freelancer.com channel. Run by hand if needed.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: job-scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python products/freelance/scan_jobs.py
      - run: |
          git config user.name "Claude Space Bot" && git config user.email "dspinjr@gmail.com"
          git add -A && git diff --cached --quiet || git commit -m "Job scan $(date -u +%FT%H:%M) [actions]"
          git pull --rebase origin main && git push origin main
