name: deep-value-filings

# Builds the offline research bundle. Cloud agents can only reach github.com,
# api.github.com and PyPI, so all SEC/Alpha Vantage traffic happens here and the
# result is published as the single asset on the rolling `filings-latest`
# release. Agents pull it with research/deepvalue/fetch_bundle.sh.
on:
  schedule:
    - cron: "30 3 * * 0"      # Sunday 03:30 UTC: full sweep of the whole universe
    - cron: "30 3 * * 1-6"    # Mon-Sat 03:30 UTC: incremental delta
  workflow_dispatch:
    inputs:
      mode:
        description: "full (refetch everything) or incremental (only new filings)"
        type: choice
        options: [incremental, full]
        default: incremental
      limit:
        description: "optional: only the top N ranked tickers (testing)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: deep-value-filings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q pandas numpy yfinance requests beautifulsoup4 lxml

      - name: Decide mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "30 3 * * 0" ]; then
            MODE="full"
          else
            MODE="incremental"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_LIMIT" ]; then
            echo "limit=--limit $INPUT_LIMIT" >> "$GITHUB_OUTPUT"
          else
            echo "limit=" >> "$GITHUB_OUTPUT"
          fi
          echo "Running in $MODE mode"

      # The runner starts with no filings/ (gitignored, shipped as a release
      # asset). Pull the previous bundle so incremental has something to diff
      # against and so accumulated transcripts are not lost.
      - name: Restore previous bundle
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: bash research/deepvalue/fetch_bundle.sh || echo "no previous bundle yet - starting cold"

      - name: Screen (writes candidates + the sub-$2B universe)
        run: python research/deepvalue/screen.py --universe-out research/deepvalue/universe_under2b.csv

      - name: Fetch filings, transcripts and press releases
        id: fetch
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          python research/deepvalue/fetch_all.py \
            --${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.limit }}

      - name: Build bundle
        if: steps.fetch.outputs.changed == 'true' || steps.mode.outputs.mode == 'full'
        run: python research/deepvalue/bundle.py

      - name: Publish bundle to the filings-latest release
        if: steps.fetch.outputs.changed == 'true' || steps.mode.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create filings-latest --title "Filings bundle" --notes "auto" || true
          gh release upload filings-latest filings_bundle.tar.gz --clobber

      - name: Commit the small tracked files
        run: |
          set -e
          git config user.name "Claude Space Bot" && git config user.email "dspinjr@gmail.com"
          mkdir -p /tmp/keep/research/deepvalue/filings
          for f in research/deepvalue/universe_under2b.csv research/deepvalue/CANDIDATES.md research/deepvalue/candidates.csv research/deepvalue/filings/MANIFEST.json; do [ -f "$f" ] && cp "$f" "/tmp/keep/$f"; done
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/keep/research .
            git add -f research/deepvalue/universe_under2b.csv research/deepvalue/CANDIDATES.md research/deepvalue/candidates.csv research/deepvalue/filings/MANIFEST.json
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            git commit -qm "Filings: $(date -u +%F) $MODE [actions]" && git push origin HEAD:main && exit 0
            sleep $((i*15))
          done
          echo "push failed after retries" && exit 1
